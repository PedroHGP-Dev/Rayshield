<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT - Sensor de Barreira Laser</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .status-box {
            transition: all 0.4s ease;
            min-height: 100px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body text-center p-4">
                        <h1 class="mb-4 h3">Leitor MQTT</h1>
                        <p>Status: <span id="status" class="badge bg-secondary">Desconectado</span></p>

                        <div id="caixa-alarme"
                            class="status-box alert alert-secondary d-flex align-items-center justify-content-center border-0 rounded-3 my-4 shadow-sm">
                            <h3 id="texto-alarme" class="m-0 fw-bold">Aguardando dados...</h3>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Última mensagem recebida (Valor LDR):</label>
                            <div id="mensagem" class="alert alert-primary fs-2 fw-bold text-dark">Nenhuma mensagem
                                recebida</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
